# Deploy flik.co.id to S3 + CloudFront when a release is published (like merchant-dashboard's prod).
# Redeploy or roll back: Actions -> Deploy to AWS -> Run workflow, choosing a release tag under "Use workflow from".
# Same setup as merchant-dashboard-revamp (aws-deploy.yaml): self-hosted aws-runner and
# PROD_AWS_ACCESS_KEY_ID / PROD_AWS_SECRET_ACCESS_KEY secrets (here: a deploy-only IAM user).
# Setup: sh scripts/aws-setup.sh (see .github/AWS-SETUP.md)
name: Deploy to AWS

on:
  release:
    types: [published]   # not drafts; a draft deploys when it is published
  workflow_dispatch:

# one deploy at a time; a newer release waits for the running one
concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

jobs:
  deploy:
    # release tags only, also for manual runs (the production environment allows only tags too);
    # skips quietly until the repo variables are set
    if: ${{ startsWith(github.ref, 'refs/tags/') && vars.S3_BUCKET != '' && vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
    runs-on: aws-runner
    environment: production
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}

      # aws-runner is shared with other repos, so never run an aws binary that another job
      # could have left behind: install a fresh AWS CLI v2 into this job's temp dir every run
      # (RUNNER_TEMP is wiped after each job)
      - name: Install AWS CLI
        run: |
          command -v python3 >/dev/null || { echo "::error::python3 is missing on $RUNNER_NAME"; exit 1; }
          dir="$RUNNER_TEMP/aws-cli"
          curl -sSfL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$RUNNER_TEMP/awscliv2.zip"
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/aws/install" --install-dir "$dir/dist" --bin-dir "$dir/bin"
          rm -rf "$RUNNER_TEMP/awscliv2.zip" "$RUNNER_TEMP/aws"
          echo "$dir/bin" >> "$GITHUB_PATH"
          export PATH="$dir/bin:$PATH"
          python3 --version
          aws --version
          aws sts get-caller-identity --query Arn --output text

      - name: Build and deploy
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          CLOUDFRONT_FUNCTION_NAME: ${{ vars.CLOUDFRONT_FUNCTION_NAME }}
        run: sh scripts/deploy-aws.sh

      - name: Check the live site
        if: ${{ vars.SITE_URL != '' }}
        run: |
          for p in / /pricing/ /legal/terms/ /customers/erigo/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.SITE_URL }}$p")
            echo "$code $p"
            [ "$code" = 200 ] || exit 1
          done
