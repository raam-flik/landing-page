<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLIK Dashboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (Stripe dashboard look) ===== */
:root{
  --ink:#1A1B25; --text:#353A44; --muted:#687385; --faint:#8C95A3;
  --line:#EBEEF1; --line-2:#D8DEE4; --hover:#F6F8FA; --search:#F5F6F8;
  --primary:#533AFD; --primary-h:#4330E0; --primary-soft:#F1EFFF;
  --ok-bg:#D7F7C2; --ok-tx:#05690D; --ok-bd:#A6EB84;
  --gr-bg:#EBEEF1; --gr-tx:#545969; --gr-bd:#D5DBE1;
  --warn-bg:#FCEDB9; --warn-tx:#A82C00; --warn-bd:#F7D46E;
  --bad-bg:#FFE7F2; --bad-tx:#B3093C; --bad-bd:#FFC0DB;
  --pu-bg:#F2EBFF; --pu-tx:#5B2BCF; --pu-bd:#D6C6FF;
  --sh:0 0 0 1px rgba(64,68,82,.08),0 2px 5px rgba(64,68,82,.08);
  --pop:0 0 0 1px rgba(64,68,82,.08),0 8px 24px -4px rgba(64,68,82,.18),0 16px 48px -8px rgba(64,68,82,.18);
  --font:'Inter',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:#fff;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;background:#fff;display:flex;flex-direction:column}
.acct{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.acct:hover{background:var(--hover)}
.acct .lg{width:28px;height:28px;border-radius:7px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.acct b{font-weight:600;font-size:14.5px;color:var(--ink);flex:1}
.nav{padding:16px 10px;display:grid;gap:2px}
.ni{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:6px;color:var(--text);font-size:14px;width:100%;text-align:left}
.ni:hover{background:var(--hover)}
.ni.on{color:var(--primary);font-weight:500}
.ni svg{color:var(--muted)}
.ni.on svg{color:var(--primary)}
.ni .chev{margin-left:auto;color:var(--faint);transition:transform .15s}
.grp.open>.ni .chev{transform:rotate(180deg)}
.sub{display:none;padding:2px 0 4px 30px}
.grp.open .sub{display:grid}
.sub .ni{height:30px;font-size:13.5px}
.navh{font-size:12.5px;color:var(--muted);padding:18px 10px 6px;font-weight:500}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;position:sticky;top:0;background:#fff;z-index:20}
.burger{display:none;width:34px;height:34px;border-radius:6px;align-items:center;justify-content:center;color:var(--muted)}
.search{flex:1;display:flex;align-items:center;gap:8px;height:38px;border-radius:8px;background:var(--search);padding:0 12px;color:var(--muted);max-width:860px}
.search input{border:0;outline:0;background:transparent;flex:1;font-size:14px;color:var(--text);min-width:0}
.search:focus-within{box-shadow:0 0 0 2px rgba(83,58,253,.35);background:#fff}
.search kbd{font-family:var(--font);font-size:11.5px;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--faint);background:#fff}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.ib{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.ib:hover{background:var(--hover);color:var(--text)}
.ib .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#DF1B41;border:1.5px solid #fff}
.plus{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin-left:4px}
.plus:hover{background:var(--primary-h)}

.content{padding:8px 28px 48px}
h1{font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.4px;margin-top:6px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-top:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 0 11px;color:var(--muted);font-weight:500;font-size:14.5px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.tab .ct{font-size:12px;color:var(--faint);margin-left:4px;font-weight:400}

/* Filters */
.filters{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.chip{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 12px 0 9px;border-radius:999px;border:1px dashed var(--line-2);color:var(--muted);font-size:13.5px;font-weight:500;position:relative;white-space:nowrap}
.chip:hover{background:var(--hover)}
.chip svg{color:var(--faint)}
.chip.set{border-style:solid;border-color:var(--line-2);color:var(--text);background:#fff}
.chip.set .val{color:var(--primary)}
.chip.set .clr{color:var(--faint);margin-left:2px}
.chip.set .clr:hover{color:var(--text)}
.pillf{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 13px 0 9px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);border:1px dashed var(--line-2)}
.pillf.on{border:0;color:#fff;background:linear-gradient(90deg,#7A4DFF 0%,#B24CF0 55%,#F06BB2 100%);box-shadow:0 2px 6px rgba(122,77,255,.3)}
.pillf.on svg{color:#fff}
.fright{margin-left:auto;display:flex;gap:8px}
.btn{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:6px;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn-o{background:#fff;box-shadow:var(--sh);color:var(--text)}
.btn-o:hover{box-shadow:0 0 0 1px rgba(64,68,82,.16),0 2px 5px rgba(64,68,82,.1)}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-h)}
.btn-p:disabled{background:#B9B0FE;cursor:not-allowed}
.btn-d{background:#fff;box-shadow:var(--sh);color:#B3093C}

/* Popovers */
.pop{position:absolute;z-index:60;background:#fff;border-radius:10px;box-shadow:var(--pop);min-width:230px;padding:6px;display:none}
.pop.open{display:block}
.pop h6{font-size:12.5px;font-weight:600;color:var(--ink);padding:8px 10px 6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;font-size:13.5px;text-align:left}
.opt:hover{background:var(--hover)}
.cb{width:16px;height:16px;border-radius:4px;border:1px solid #C0C8D2;display:flex;align-items:center;justify-content:center;flex:none;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.cb.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cb.mixed{background:var(--primary);border-color:var(--primary)}
.cb.mixed::after{content:"";width:8px;height:2px;background:#fff;border-radius:1px}
.rdo{width:16px;height:16px;border-radius:50%;border:1px solid #C0C8D2;flex:none;position:relative}
.rdo.on{border:5px solid var(--primary)}
.pop-f{display:flex;justify-content:flex-end;gap:6px;padding:8px 6px 4px;border-top:1px solid var(--line);margin-top:6px}
.menu .opt.danger{color:#B3093C}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}

/* Table */
.bulk{display:none;align-items:center;gap:10px;margin-top:16px;padding:8px 12px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-weight:500}
.bulk.show{display:flex}
.bulk .sp{flex:1}
.tbl-wrap{overflow-x:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;min-width:860px}
th{text-align:left;font-size:13.5px;font-weight:600;color:var(--ink);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.sort{cursor:pointer}
th.sort:hover{color:var(--primary)}
th .si{display:inline-flex;vertical-align:middle;margin-left:3px;color:var(--faint)}
th.sorted .si{color:var(--primary)}
td{padding:0 8px;height:52px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:14px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr.sel td{background:#F7F5FF}
.c-chk{width:36px}
.amt{font-weight:600;color:var(--ink);text-align:right;width:1%;padding-right:10px}
.cur{color:var(--muted);width:1%;padding-right:24px}
.c-st{width:150px}
.st{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:5px;font-size:12.5px;font-weight:500;border:1px solid}
.st.ok{background:var(--ok-bg);color:var(--ok-tx);border-color:var(--ok-bd)}
.st.gr{background:var(--gr-bg);color:var(--gr-tx);border-color:var(--gr-bd)}
.st.warn{background:var(--warn-bg);color:var(--warn-tx);border-color:var(--warn-bd)}
.st.bad{background:var(--bad-bg);color:var(--bad-tx);border-color:var(--bad-bd)}
.st.pu{background:var(--pu-bg);color:var(--pu-tx);border-color:var(--pu-bd)}
.pm{display:flex;align-items:center;gap:10px}
.pmb{width:34px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;letter-spacing:.2px;color:#fff;flex:none}
.pmd{color:var(--text)}
.pmd .dots{letter-spacing:1px;margin-right:3px}
.date,.rdate{color:var(--text)}
.rdate.none{color:var(--faint)}
.dots-b{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-left:auto}
.dots-b:hover{background:#fff;box-shadow:var(--sh)}
.src{font-size:12.5px;color:var(--muted)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;color:var(--muted);font-size:13.5px}
.foot b{color:var(--text);font-weight:600}
.pager{display:flex;gap:8px}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(26,27,37,.28);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100%;background:#fff;z-index:80;box-shadow:var(--pop);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh .kind{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.db{padding:20px;overflow-y:auto;flex:1}
.d-amt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-amt b{font-size:26px;font-weight:600;color:var(--ink);letter-spacing:-.4px}
.d-amt .cur{padding:0;font-size:16px;width:auto}
.d-sub{color:var(--muted);margin-top:4px;font-size:13px}
.d-acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.dsec{margin-top:26px}
.dsec h5{font-size:15px;font-weight:600;color:var(--ink);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:9px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{color:var(--text);word-break:break-word}
.tl{display:grid;gap:0}
.tli{display:grid;grid-template-columns:18px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tli::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:1px;background:var(--line-2)}
.tli:last-child::before{display:none}
.tli i{width:17px;height:17px;border-radius:50%;background:var(--hover);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tli.ok i{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-tx)}
.tli.pu i{background:var(--pu-bg);border-color:var(--pu-bd);color:var(--pu-tx)}
.tli b{font-weight:500;display:block;font-size:13.5px;color:var(--ink)}
.tli span{font-size:12.5px;color:var(--muted)}

/* Modal + toast */
.mscrim{position:fixed;inset:0;background:rgba(26,27,37,.35);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.mscrim.open{display:flex}
.modal{background:#fff;border-radius:12px;box-shadow:var(--pop);width:100%;max-width:440px}
.mh{padding:20px 22px 6px;display:flex;justify-content:space-between;align-items:center}
.mh h3{font-size:17px;font-weight:600;color:var(--ink)}
.mb{padding:10px 22px;display:grid;gap:14px}
.mf{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:8px}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--ink)}
.fld input{width:100%;height:36px;border-radius:6px;border:0;box-shadow:var(--sh);padding:0 10px;outline:none}
.fld input:focus{box-shadow:0 0 0 2px rgba(83,58,253,.4)}
.fld .hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:100;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Responsive */
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:85;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--pop)}
  .side.open{transform:none}
  .burger{display:flex}
  .top{padding:12px 16px}
  .content{padding:4px 16px 40px}
  .search kbd{display:none}
}
@media (max-width:600px){
  .tools .ib.hide-s{display:none}
  .fright{margin-left:0;width:100%}
  .drawer{width:100%}
  .kv{grid-template-columns:120px 1fr}
  h1{font-size:24px}
}

/* ===== Home ===== */
[hidden]{display:none!important}
h2.sec{font-size:18px;font-weight:600;color:var(--ink);margin-top:28px;letter-spacing:-.2px}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}
.qa{display:flex;align-items:center;gap:14px;padding:16px;border-radius:8px;box-shadow:var(--sh);background:#fff;text-align:left;width:100%;transition:box-shadow .15s}
.qa:hover{box-shadow:0 0 0 1px rgba(64,68,82,.14),0 4px 12px rgba(64,68,82,.1)}
.qic{width:40px;height:40px;border-radius:8px;background:#fff;border:1px solid #E3E8EE;color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.qa .qt{flex:1;min-width:0}
.qa .qt b{display:block;font-weight:600;color:var(--ink);font-size:14.5px}
.qa .qt span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.qa .btn{flex:none}
.card{box-shadow:var(--sh);border-radius:8px;padding:20px 20px 12px;margin-top:12px;background:#fff}
.kpi-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.kpi-v{display:flex;align-items:center;gap:10px}
.kpi-v b{font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.4px}
.kpi-l{color:var(--muted);font-size:13.5px}
.delta{font-size:12.5px;font-weight:500;padding:2px 7px;border-radius:5px}
.delta.up{background:var(--ok-bg);color:var(--ok-tx)}
.delta.down{background:var(--bad-bg);color:var(--bad-tx)}
.kpi-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--search);border-radius:8px;padding:3px}
.seg button{height:28px;padding:0 12px;border-radius:6px;font-weight:500;color:var(--muted);font-size:13.5px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.chart{position:relative;margin-top:16px;height:300px}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .gl{stroke:var(--line)}
.chart .ax{fill:var(--faint);font-size:11.5px;font-family:var(--font)}
.chart .cur-line{stroke:var(--line-2);stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:#fff;border-radius:8px;box-shadow:var(--pop);padding:8px 10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-12px;display:none}
.tip b{display:block;color:var(--ink);font-size:13.5px;font-weight:600}
.tip span{color:var(--muted)}
.amtopts{display:flex;gap:8px;flex-wrap:wrap}
.amtopts button{height:30px;padding:0 12px;border-radius:999px;box-shadow:var(--sh);font-size:13px;font-weight:500}
.amtopts button.on{box-shadow:0 0 0 1.5px var(--primary);color:var(--primary)}
.paylist{display:grid;gap:6px}
.payopt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;box-shadow:var(--sh);text-align:left;width:100%}
.payopt.on{box-shadow:0 0 0 1.5px var(--primary)}
.vabox{background:var(--search);border-radius:8px;padding:14px;display:grid;gap:4px}
.vabox b{font-size:20px;color:var(--ink);letter-spacing:1px}
.trk-tl{display:grid;margin-top:4px}
@media (max-width:1380px){.qa-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.qa-grid{grid-template-columns:1fr}.chart{height:240px}.qa .qt span{white-space:normal}}
</style>
</head>
<body>
<div class="app">
  <!-- ===== Sidebar ===== -->
  <aside class="side" id="side">
    <button class="acct" data-toast="Switch business account">
      <span class="lg"><svg width="16" height="16" viewBox="0 0 32 32"><path d="M27.6 18.8c0-4.3-2.4-5.4-5.4-5.4h-5.6v8.8c0 3 1.3 5.4 5.5 5.4v-8.8h5.5Z" fill="#F26324"/><path d="M30.9 10.4c0-5.3-2.5-6-5.5-6H7.4v17.8c0 3 .7 5.4 6.3 5.4V10.4h17.2Z" fill="#F26324"/></svg></span>
      <b>Aruna Studio</b>
      <span data-ic="sel"></span>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">FLIK Dashboard · Prototype</div>
  </aside>
  <div class="scrim" id="sidescrim"></div>

  <!-- ===== Main ===== -->
  <div class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Open menu"><span data-ic="menu"></span></button>
      <label class="search"><span data-ic="search"></span><input id="q" placeholder="Search" autocomplete="off"><kbd>/</kbd></label>
      <div class="tools">
        <button class="ib hide-s" data-toast="Opens FLIK help center" aria-label="Help"><span data-ic="help"></span></button>
        <button class="ib" id="bell" aria-label="Notifications"><span data-ic="bell"></span><span class="dot"></span></button>
        <button class="ib hide-s" data-toast="Opens Settings" aria-label="Settings"><span data-ic="gear"></span></button>
        <button class="plus" id="plus" aria-label="Create"><span data-ic="plus"></span></button>
      </div>
    </header>

    <main class="content" id="view-home" hidden>
      <h1>Home</h1>
      <h2 class="sec">Quick access</h2>
      <div class="qa-grid" id="qa"></div>
      <h2 class="sec">Sales summary</h2>
      <section class="card">
        <div class="kpi-row">
          <div class="kpi"><div class="kpi-v"><b class="num" id="kpi">0</b><span class="delta" id="delta"></span></div><span class="kpi-l" id="kpi-l">Last 7 days</span></div>
          <div class="kpi-ctl">
            <button class="chip set" id="range"><span>Period</span> <span class="val" id="range-v">Last 7 days</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg></button>

};
const ic=(n,s=16,w=1.7)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const paintIcons=root=>root.querySelectorAll('[data-ic]').forEach(e=>{const k=e.dataset.ic,top=!!e.closest('.ib');e.innerHTML=ic(k,k==='plus'?20:top?22:16,k==='plus'?2.2:top?1.6:1.7)});
paintIcons(document);

/* ===== Sidebar ===== */
const NAV=[
  {i:'home',t:'Home',v:'home'},{i:'bal',t:'Balances'},{i:'tx',t:'Transactions',v:'tx'},{i:'user',t:'Customers'},{i:'box',t:'Product catalog'},
  {h:'Products'},
  {i:'cart',t:'Checkout',sub:['Orders','Payment methods','Checkout personalization','Order analytics']},
  {i:'truck',t:'Shipping',sub:['Shipments','Bulk shipping','Warehouses','Courier performance']},
  {i:'coins',t:'Funding',sub:['Merchant cash advance','Auto settlement']},
  {i:'chart',t:'Reporting',sub:['Reports','Exports']},
  {i:'more',t:'More',sub:['Developers','Settings']}
];
const nav=document.getElementById('nav');
nav.innerHTML=NAV.map(n=>n.h?`<div class="navh">${n.h}</div>`:n.sub?`<div class="grp"><button class="ni">${ic(n.i)}${n.t}<span class="chev">${ic('chev',14)}</span></button><div class="sub">${n.sub.map(s=>`<button class="ni" data-toast="Opens ${s}">${s}</button>`).join('')}</div></div>`:n.v?`<button class="ni" data-view="${n.v}">${ic(n.i)}${n.t}</button>`:`<button class="ni" data-toast="Opens ${n.t}">${ic(n.i)}${n.t}</button>`).join('');
nav.querySelectorAll('.grp>.ni').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
const side=document.getElementById('side'),sscrim=document.getElementById('sidescrim');
const setSide=o=>{side.classList.toggle('open',o);sscrim.classList.toggle('open',o)};
document.getElementById('burger').onclick=()=>setSide(true);
sscrim.onclick=()=>setSide(false);

/* ===== Dummy data (seeded, so it's the same on every load) ===== */
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const pick=a=>a[Math.floor(rnd()*a.length)];
const METHODS={
  qris:{cat:'QRIS',bg:'#111',txt:'QRIS',d:()=>'QRIS · '+pick(['BCA mobile','GoPay','OVO','DANA','ShopeePay'])},
  gopay:{cat:'E-wallet',bg:'#00AED6',txt:'gopay',d:()=>'GoPay · +62 812-•••-'+(1000+Math.floor(rnd()*8999))},
  ovo:{cat:'E-wallet',bg:'#4C3494',txt:'OVO',d:()=>'OVO · +62 813-•••-'+(1000+Math.floor(rnd()*8999))},
  dana:{cat:'E-wallet',bg:'#118EEA',txt:'DANA',d:()=>'DANA · +62 857-•••-'+(1000+Math.floor(rnd()*8999))},
  bca:{cat:'Virtual account',bg:'#005EAA',txt:'BCA',d:()=>'VA <span class="dots">••••</span>'+(1000+Math.floor(rnd()*8999))},
  mandiri:{cat:'Virtual account',bg:'#003D79',txt:'mandiri',d:()=>'VA <span class="dots">••••</span>'+(1000+Math.floor(rnd()*8999))},
  bni:{cat:'Virtual account',bg:'#F15A23',txt:'BNI',d:()=>'VA <span class="dots">••••</span>'+(1000+Math.floor(rnd()*8999))},
  visa:{cat:'Card',bg:'#1A1F71',txt:'VISA',d:()=>'<span class="dots">••••</span>'+pick(['0876','7662','4242','3077'])},
  mc:{cat:'Card',bg:'#111',txt:'mc',d:()=>'<span class="dots">••••</span>'+pick(['4949','5454','0876'])},
  cod:{cat:'COD',bg:'#1EA672',txt:'COD',d:()=>'Cash on delivery'}
};
const MKEYS=['qris','qris','qris','gopay','ovo','dana','bca','bca','mandiri','bni','visa','mc','cod','cod'];
const CUST=['Rina Putri','Budi Santoso','Sari Wulandari','Andi Pratama','Dewi Lestari','Fajar Nugroho','Maya Sari','Rizky Ramadhan','Putri Ayu','Agus Setiawan','Nadia Rahma','Yoga Saputra'];
const CITY=['Jakarta','Bandung','Surabaya','Medan','Denpasar','Makassar','Yogyakarta','Semarang'];
const SRC=['FLIK Checkout','FLIK Checkout','FLIK Checkout','FLIK Checkout','Payment link','Invoice'];
const NOW=new Date(2026,9,14,16,20);
const PAY=[];let t=NOW.getTime();
for(let i=0;i<380;i++){
  t-=Math.floor((.5+rnd()*8)*3600*1000);
  const m=pick(MKEYS),r=rnd();
  let st=r<.74?'succeeded':r<.82?'refunded':r<.88?'pending':r<.94?'canceled':'failed';
  if(m==='cod'&&st==='failed')st='canceled';
  const amt=Math.round((49000+rnd()*rnd()*2400000)/500)*500;
  const created=new Date(t);
  PAY.push({id:'py_'+Math.random().toString(36).slice(2,8)+Math.floor(rnd()*1e6).toString(36),amount:amt,currency:'IDR',status:st,mk:m,method:METHODS[m].d(),customer:pick(CUST),city:pick(CITY),source:m==='cod'?'FLIK Checkout':pick(SRC),
    order:'FLK-'+(20480-i),created,refunded:st==='refunded'?new Date(t+Math.floor((1+rnd()*48)*3600*1000)):null,
    courier:pick(['Regular','Same day','Next day','Instant']),awb:'FLK'+created.getFullYear().toString().slice(2)+String(created.getMonth()+1).padStart(2,'0')+String(created.getDate()).padStart(2,'0')+String(1000+i)});
}
const SETTLE=Array.from({length:18},(_,i)=>{const d=new Date(NOW.getTime()-i*86400000);return{id:'st_'+(9000-i),amount:Math.round((800000+rnd()*2200000)/1000)*1000,status:i===0?'pending':'succeeded',created:d,ref:'MCA-0007'}});

/* ===== Formatting ===== */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const rp=n=>'Rp '+Math.abs(n).toLocaleString('id-ID');
const fdate=d=>`${d.getDate()} ${MON[d.getMonth()]}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const fdateY=d=>`${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const ST={succeeded:['Succeeded','ok','check'],refunded:['Refunded','pu','refund'],pending:['Pending','warn',null],canceled:['Canceled','gr','x'],failed:['Failed','bad','x']};
const stPill=s=>{const x=ST[s];return`<span class="st ${x[1]}">${x[0]}${x[2]?ic(x[2],13,2.2):''}</span>`};
const pmBadge=k=>{const m=METHODS[k];if(k==='mc')return`<span class="pmb" style="background:#111"><svg width="22" height="14" viewBox="0 0 22 14"><circle cx="8" cy="7" r="5.5" fill="#EB001B"/><circle cx="14" cy="7" r="5.5" fill="#F79E1B" opacity=".9"/></svg></span>`;return`<span class="pmb" style="background:${m.bg}">${m.txt}</span>`};

/* ===== State ===== */
const TABS=[['payments','Payments'],['cod','COD payouts'],['refunds','Refunds'],['settle','Auto settlements']];
const S={tab:'payments',q:'',date:null,status:new Set(),method:new Set(),srcOnly:true,sort:{k:'created',dir:-1},page:0,sel:new Set()};
const PER=15;

function rows(){
  let r;
  if(S.tab==='settle')r=SETTLE.map(x=>({...x}));
  else{
    r=PAY.filter(p=>S.tab==='payments'||(S.tab==='cod'?p.mk==='cod'&&p.status==='succeeded':p.status==='refunded'));
    if(S.srcOnly)r=r.filter(p=>p.source==='FLIK Checkout');
    if(S.status.size)r=r.filter(p=>S.status.has(p.status));
    if(S.method.size)r=r.filter(p=>S.method.has(METHODS[p.mk].cat));
  }
  if(S.date){const days={today:1,'7d':7,'30d':30,'90d':90}[S.date];const from=new Date(NOW);from.setHours(0,0,0,0);from.setDate(from.getDate()-(days-1));r=r.filter(p=>p.created>=from)}
  if(S.q){const q=S.q.toLowerCase().replace(/[.\s]/g,'');r=r.filter(p=>[p.id,p.order,p.customer,p.method,String(p.amount),p.awb,p.ref].filter(Boolean).join(' ').toLowerCase().replace(/<[^>]+>|[.\s•]/g,'').includes(q))}
  const k=S.sort.k,d=S.sort.dir;
  r.sort((a,b)=>{const va=a[k]??(d>0?Infinity:-Infinity),vb=b[k]??(d>0?Infinity:-Infinity);return (va>vb?1:va<vb?-1:0)*d});
  return r;
}

/* ===== Render ===== */
const tabsEl=document.getElementById('tabs');
function renderTabs(){
  const n={payments:PAY.length,cod:PAY.filter(p=>p.mk==='cod'&&p.status==='succeeded').length,refunds:PAY.filter(p=>p.status==='refunded').length,settle:SETTLE.length};
  tabsEl.innerHTML=TABS.map(t=>`<button class="tab${S.tab===t[0]?' on':''}" data-t="${t[0]}" role="tab" aria-selected="${S.tab===t[0]}">${t[1]}</button>`).join('');
  tabsEl.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.page=0;S.sel.clear();if(S.tab==='refunds'&&S.sort.k==='created')S.sort={k:'refunded',dir:-1};if(S.tab!=='refunds'&&S.sort.k==='refunded'&&S.tab!=='payments')S.sort={k:'created',dir:-1};render()});
}
function cols(){
  if(S.tab==='settle')return[['amount','Amount',1],['status','',0],['ref','Cash advance',0],['created','Date',1]];
  if(S.tab==='cod')return[['amount','Amount',1],['status','',0],['fee','COD fee (3%)',0],['net','Added to balance',0],['created','Delivered',1]];
  return[['amount','Amount',1],['status','',0],['method','Payment method',0],['created','Date',1],['refunded','Refunded date',1]];
}
function render(){
  renderTabs();
  const all=rows(),pages=Math.max(1,Math.ceil(all.length/PER));S.page=Math.min(S.page,pages-1);
  const view=all.slice(S.page*PER,S.page*PER+PER);
  const C=cols();
  const allSel=view.length&&view.every(r=>S.sel.has(r.id)),someSel=view.some(r=>S.sel.has(r.id));
  document.getElementById('thead').innerHTML=`<tr><th class="c-chk"><button class="cb ${allSel?'on':someSel?'mixed':''}" id="selall" aria-label="Select all">${allSel?ic('check',12,3):''}</button></th>`+
    C.map(c=>{if(c[0]==='status')return'<th></th>';const sorted=S.sort.k===c[0];return`<th class="${c[2]?'sort':''}${sorted?' sorted':''}" ${c[2]?`data-s="${c[0]}"`:''} ${c[0]==='amount'?'colspan="2"':''}>${c[1]}${c[2]?`<span class="si">${ic(sorted?(S.sort.dir>0?'up':'down'):'sort',13,2)}</span>`:''}</th>`}).join('')+'<th style="width:40px"></th></tr>';
  const tb=document.getElementById('tbody');
  if(!view.length){tb.innerHTML=`<tr><td colspan="9" style="height:auto;border:0;cursor:default"><div class="empty"><b>No results</b>Try changing the filters or search.</div></td></tr>`}
  else tb.innerHTML=view.map(r=>{
    const on=S.sel.has(r.id);
    let cells=`<td class="amt num">${rp(r.amount)}</td><td class="cur">IDR</td><td class="c-st">${stPill(r.status)}</td>`;
    if(S.tab==='settle')cells+=`<td><span class="pmd">${r.ref}</span> <span class="src">· Auto settlement</span></td><td class="date">${fdate(r.created)}</td>`;
    else if(S.tab==='cod'){const fee=Math.round(r.amount*.03);cells+=`<td class="num">−${rp(fee)}</td><td class="num" style="font-weight:500">${rp(r.amount-fee)}</td><td class="date">${fdate(r.created)}</td>`}
    else cells+=`<td><div class="pm">${pmBadge(r.mk)}<span class="pmd">${r.method}</span></div></td><td class="date">${fdate(r.created)}</td><td class="rdate${r.refunded?'':' none'}">${r.refunded?fdate(r.refunded):'—'}</td>`;
    return`<tr data-id="${r.id}" class="${on?'sel':''}"><td class="c-chk"><button class="cb ${on?'on':''}" data-chk="${r.id}" aria-label="Select row">${on?ic('check',12,3):''}</button></td>${cells}<td><button class="dots-b" data-menu="${r.id}" aria-label="More">${ic('dots',16)}</button></td></tr>`;
  }).join('');
  document.getElementById('count').innerHTML=all.length?`Viewing <b>${S.page*PER+1}–${Math.min(all.length,S.page*PER+PER)}</b> of <b>${all.length}</b> results`:'Viewing <b>0</b> results';
  document.getElementById('prev').disabled=S.page===0;document.getElementById('next').disabled=S.page>=pages-1;
  document.getElementById('prev').style.opacity=S.page===0?.5:1;document.getElementById('next').style.opacity=S.page>=pages-1?.5:1;
  const bulk=document.getElementById('bulk');bulk.classList.toggle('show',S.sel.size>0);document.getElementById('bulk-n').textContent=`${S.sel.size} selected`;
  document.getElementById('bulk-refund').style.display=S.tab==='payments'?'':'none';
  renderChips();
  // wire
  document.getElementById('selall').onclick=e=>{e.stopPropagation();if(allSel)view.forEach(r=>S.sel.delete(r.id));else view.forEach(r=>S.sel.add(r.id));render()};
  document.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{const k=th.dataset.s;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==='amount'?-1:-1};render()});
  tb.querySelectorAll('[data-chk]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.chk;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);render()});
  tb.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();rowMenu(b,b.dataset.menu)});
  tb.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openDetail(tr.dataset.id));
}
document.getElementById('prev').onclick=()=>{S.page--;render()};
document.getElementById('next').onclick=()=>{S.page++;render()};
document.getElementById('bulk-clear').onclick=()=>{S.sel.clear();render()};

/* ===== Filters ===== */
const DATE_OPTS=[['today','Today'],['7d','Last 7 days'],['30d','Last 30 days'],['90d','Last 90 days']];
const STATUS_OPTS=['succeeded','pending','refunded','canceled','failed'];
const METHOD_OPTS=['QRIS','E-wallet','Virtual account','Card','COD'];
function renderChips(){
  document.querySelectorAll('#filters .chip').forEach(ch=>{
    const f=ch.dataset.f,base={date:'Date and time',status:'Status',method:'Payment method'}[f];
    let val='';
    if(f==='date'&&S.date)val=DATE_OPTS.find(o=>o[0]===S.date)[1];
    if(f==='status'&&S.status.size)val=[...S.status].map(s=>ST[s][0]).join(', ');
    if(f==='method'&&S.method.size)val=[...S.method].join(', ');
    const disabled=S.tab==='settle'&&f!=='date';
    ch.style.display=disabled?'none':'';
    ch.classList.toggle('set',!!val);
    ch.innerHTML=val?`<span class="clr" data-clr="${f}">${ic('x',14,2)}</span>${base} <span class="val">${val.length>28?val.slice(0,26)+'…':val}</span>`:`${ic('pluscirc',15)}${base}`;

/* Sales summary chart (from the same dummy payments as Transactions) */
const H={metric:'count',days:7};
function series(days,offset=0){
  const out=[];for(let i=days-1;i>=0;i--){const d0=new Date(NOW);d0.setHours(0,0,0,0);d0.setDate(d0.getDate()-i-offset);const d1=new Date(d0);d1.setDate(d1.getDate()+1);
    const ps=PAY.filter(p=>p.status==='succeeded'&&p.created>=d0&&p.created<d1);out.push({d:d0,count:ps.length,gmv:ps.reduce((a,p)=>a+p.amount,0)})}
  return out;
}
const compact=n=>n>=1e9?'Rp '+(n/1e9).toLocaleString('id-ID',{maximumFractionDigits:1})+' M':n>=1e6?'Rp '+(n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt':n>=1e3?'Rp '+Math.round(n/1e3)+' rb':'Rp '+n;
function niceMax(v){if(v<=0)return H.metric==='count'?6:1000000;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,1.2,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v)return m*p;return 10*p}
function drawChart(){
  const el=document.getElementById('chart');const W=el.clientWidth,Hh=el.clientHeight;if(!W)return;
  const data=series(H.days),prev=series(H.days,H.days),key=H.metric;
  const total=data.reduce((a,x)=>a+x[key],0),ptotal=prev.reduce((a,x)=>a+x[key],0);
  document.getElementById('kpi').textContent=key==='count'?total.toLocaleString('id-ID'):rp(total);
  document.getElementById('kpi-l').textContent=`Last ${H.days} days`;document.getElementById('range-v').textContent=`Last ${H.days} days`;
  const dl=document.getElementById('delta');if(ptotal){const pc=(total-ptotal)/ptotal*100;dl.className='delta '+(pc>=0?'up':'down');dl.textContent=(pc>=0?'+':'')+pc.toLocaleString('id-ID',{maximumFractionDigits:1})+'%';dl.title='Compared with the previous '+H.days+' days'}else{dl.className='delta';dl.textContent=''}
  const L=key==='count'?28:64,R=12,T=12,B=28,iw=W-L-R,ih=Hh-T-B;
  const max=niceMax(Math.max(...data.map(x=>x[key]),...prev.map(x=>x[key]))),ticks=6;
  const X=i=>L+(data.length===1?iw/2:i*iw/(data.length-1)),Y=v=>T+ih-(v/max)*ih;
  let g='';for(let i=0;i<=ticks;i++){const v=max*i/ticks,y=Y(v);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-8}" y="${y+4}" text-anchor="end">${key==='count'?Math.round(v):compact(v)}</text>`}
  const step=Math.ceil(data.length/8);data.forEach((x,i)=>{if(i%step===0||i===data.length-1)g+=`<text class="ax" x="${X(i)}" y="${Hh-6}" text-anchor="middle">${x.d.getDate()} ${MON[x.d.getMonth()]}</text>`});
  // smooth curve through the points (Catmull-Rom to Bezier, clamped so it never dips below 0)
  const smooth=pts=>pts.map((p,i)=>{if(!i)return`M${p[0].toFixed(1)},${p[1].toFixed(1)}`;const p0=pts[i-2]||pts[i-1],p1=pts[i-1],p3=pts[i+1]||p;const c1=[p1[0]+(p[0]-p0[0])/6,Math.min(T+ih,p1[1]+(p[1]-p0[1])/6)],c2=[p[0]-(p3[0]-p1[0])/6,Math.min(T+ih,p[1]-(p3[1]-p1[1])/6)];return`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p[0].toFixed(1)},${p[1].toFixed(1)}`}).join(' ');
  const line=smooth(data.map((x,i)=>[X(i),Y(x[key])]));
  const pline=smooth(prev.map((x,i)=>[X(i),Y(x[key])]));
  const area=line+` L${X(data.length-1)},${T+ih} L${X(0)},${T+ih} Z`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#533AFD" stop-opacity=".18"/><stop offset="1" stop-color="#533AFD" stop-opacity="0"/></linearGradient></defs>${g}
    <path d="${pline}" fill="none" stroke="#C0C8D2" stroke-width="1.5" stroke-dasharray="4 4"/><path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="#533AFD" stroke-width="2"/>
    <line class="cur-line" id="hl" y1="${T}" y2="${T+ih}" style="display:none"/><circle id="hp" r="4.5" fill="#fff" stroke="#533AFD" stroke-width="2" style="display:none"/>
    <rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div>`;
  const hit=el.querySelector('#hit'),hl=el.querySelector('#hl'),hp=el.querySelector('#hp'),tip=el.querySelector('#tip');
  const show=e=>{const r=el.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const i=Math.max(0,Math.min(data.length-1,Math.round((x-L)/(iw/(Math.max(1,data.length-1))))));const d=data[i],px=X(i),py=Y(d[key]);
    hl.setAttribute('x1',px);hl.setAttribute('x2',px);hl.style.display='';hp.setAttribute('cx',px);hp.setAttribute('cy',py);hp.style.display='';
    tip.innerHTML=`<b>${key==='count'?d.count+' transactions':rp(d.gmv)}</b><span>${d.d.getDate()} ${MON[d.d.getMonth()]} ${d.d.getFullYear()} · prev. ${key==='count'?prev[i].count:compact(prev[i].gmv)}</span>`;tip.style.display='block';tip.style.left=Math.max(70,Math.min(W-70,px))+'px';tip.style.top=py+'px'};
  hit.addEventListener('mousemove',show);hit.addEventListener('touchstart',show,{passive:true});hit.addEventListener('mouseleave',()=>{hl.style.display=hp.style.display='none';tip.style.display='none'});
}

  <div class="mb"><div class="fld"><label for="tamt">Amount</label><input id="tamt" class="num" value="${amt.toLocaleString('id-ID')}"></div>
  <div class="amtopts">${[100000,500000,1000000,5000000].map(v=>`<button class="${v===amt?'on':''}" data-a="${v}">${rp(v)}</button>`).join('')}</div>
  <div class="fld"><label>Pay with</label><div class="paylist">${[['bca','BCA virtual account'],['mandiri','Mandiri virtual account'],['qris','QRIS']].map(m=>`<button class="payopt${via===m[0]?' on':''}" data-v="${m[0]}">${pmBadge(m[0])}<span style="flex:1">${m[1]}</span><span class="rdo${via===m[0]?' on':''}"></span></button>`).join('')}</div></div></div>
  <div class="mf"><button class="btn btn-o" data-mclose>Cancel</button><button class="btn btn-p" id="tgo">Continue</button></div>`;
  const inp=document.getElementById('tamt'),go=document.getElementById('tgo');
  inp.oninput=()=>{amt=+inp.value.replace(/\D/g,'');go.disabled=!(amt>=10000)};
  modal.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{amt=+b.dataset.a;draw()});
  modal.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{via=b.dataset.v;draw()});
  go.onclick=()=>{modal.innerHTML=`<div class="mh"><h3>Complete your top up</h3><button class="ib" data-mclose aria-label="Close">${ic('x',18)}</button></div><div class="mb"><div class="vabox">${via==='qris'?`<span class="kpi-l">Scan with any banking or e-wallet app</span><b>QRIS · ${rp(amt)}</b>`:`<span class="kpi-l">${via==='bca'?'BCA':'Mandiri'} virtual account number</span><b class="num">8808 0812 3456 7890</b><span class="kpi-l">Transfer exactly ${rp(amt)}</span>`}</div><p class="kpi-l">Your balance updates automatically after payment.</p></div><div class="mf"><button class="btn btn-o" data-mclose>Close</button><button class="btn btn-p" id="tdone">I've paid</button></div>`;
    document.getElementById('tdone').onclick=()=>{closeModal();toast(`Top up of ${rp(amt)} is being confirmed`)}};
  };
  draw();mscrim.classList.add('open');
}
/* Track shipments */
function trackModal(){
  modal.innerHTML=`<div class="mh"><h3>Track shipments</h3><button class="ib" data-mclose aria-label="Close">${ic('x',18)}</button></div>
  <div class="mb"><div class="fld"><label for="tno">Tracking numbers</label><input id="tno" value="${PAY[0].awb}" placeholder="One or more, separated by commas"></div><div id="tres"></div></div>
  <div class="mf"><button class="btn btn-o" data-mclose>Close</button><button class="btn btn-p" id="tgo2">Track</button></div>`;
  mscrim.classList.add('open');
  const run=()=>{const nos=document.getElementById('tno').value.split(/[,\s]+/).filter(Boolean);
    document.getElementById('tres').innerHTML=nos.length?nos.map(n=>`<div class="dsec" style="margin-top:6px"><h5 style="font-size:13.5px">${n}</h5><div class="tl">${[['Out for delivery','Surabaya · 14 Oct 2026, 08:12','pu'],['Arrived at sorting hub','Surabaya · 13 Oct 2026, 22:40',''],['Picked up by courier','Jakarta · 12 Oct 2026, 15:30','']].map(x=>`<div class="tli ${x[2]}"><i></i><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('')}</div></div>`).join(''):'<p class="kpi-l">Enter at least one tracking number.</p>'};
  document.getElementById('tgo2').onclick=run;
}

/* ===== Simple router: #home / #transactions ===== */
function show(view){
  const home=view!=='tx';
  document.getElementById('view-home').hidden=!home;document.getElementById('view-tx').hidden=home;
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===(home?'home':'tx')));
  document.title=(home?'Home':'Transactions')+' | FLIK Dashboard';
  if(home)drawChart();
  closeDetail();setSide(false);scrollTo(0,0);
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.view==='home'?'home':'transactions'});
addEventListener('hashchange',()=>show(location.hash==='#transactions'?'tx':'home'));
show(location.hash==='#transactions'?'tx':'home');

</script>
</body>
